---
apiVersion: v1
kind: Namespace
metadata:
  name: settle402
---
apiVersion: v1
kind: Secret
metadata:
  name: settle402-secrets
  namespace: settle402
type: Opaque
stringData:
  SETTLER_RPC_URL: "REPLACE_ME"
  SETTLER_PRIVATE_KEY: "REPLACE_ME"
  SETTLER_API_KEYS: "REPLACE_ME"
  ADMIN_TOKEN: "REPLACE_ME"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: settle402-data
  namespace: settle402
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settle402
  namespace: settle402
  labels:
    app: settle402
spec:
  replicas: 1  # must stay 1: the nonce lock is process-local
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: settle402
  template:
    metadata:
      labels:
        app: settle402
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: settle402-data
      containers:
        - name: settle402
          image: ghcr.io/octomil/settle402:REPLACE_WITH_GIT_SHA
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          env:
            - name: SETTLER_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: settle402-secrets
                  key: SETTLER_RPC_URL
            - name: SETTLER_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: settle402-secrets
                  key: SETTLER_PRIVATE_KEY
            - name: SETTLER_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: settle402-secrets
                  key: SETTLER_API_KEYS
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: settle402-secrets
                  key: ADMIN_TOKEN
            - name: SETTLER_CHAIN_ID
              value: "8453"
            - name: SETTLER_LOG_LEVEL
              value: "info"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: settle402
  namespace: settle402
  labels:
    app: settle402
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: settle402
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: settle402
  namespace: settle402
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: api.settle402.dev
      http:
        paths:
          # /keys and /status are operator-only and intentionally not routed
          - path: /settle
            pathType: Exact
            backend:
              service:
                name: settle402
                port:
                  number: 8002
          - path: /health
            pathType: Exact
            backend:
              service:
                name: settle402
                port:
                  number: 8002
  tls:
    - secretName: settle402-tls
      hosts:
        - api.settle402.dev
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: settle402
  namespace: settle402
spec:
  podSelector:
    matchLabels:
      app: settle402
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8002
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
