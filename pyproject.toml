[project]
name = "settle402"
version = "0.1.0"
description = "Batch settlement for x402 micro-payments via Multicall3"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["x402", "micropayments", "batch-settlement", "multicall3", "usdc", "eip-3009"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "web3>=7.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://settle402.dev"
Repository = "https://github.com/octomil/settle402"
Documentation = "https://github.com/octomil/settle402#readme"
Issues = "https://github.com/octomil/settle402/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["settler*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
